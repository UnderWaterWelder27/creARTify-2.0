name: creartify
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # l10n
  intl: 0.19.0
  flutter_localizations:
    sdk: flutter

  # navigation
  auto_route: ^8.0.0

  # Dependency Injection
  get_it: ^7.6.8
  injectable: ^2.4.0

  #state management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  rxdart: ^0.27.7

  #network
  dio: ^5.4.2
  dio_http_formatter: ^3.2.1
  http_parser: ^4.0.2

  #helpers
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  logger: ^2.2.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  flutter_svg: ^2.0.10+1

  #UI
  another_flushbar: ^1.12.30

  #database
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  #notifications
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  auto_route_generator: ^8.0.0
  injectable_generator: ^2.6.1
  freezed: ^2.5.2
  flutter_gen_runner:


flutter_gen:
  output: lib/generated/
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true

flutter_intl:
  main_locale: en
  enabled: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/bottom_bar/
    - assets/fonts/

  fonts:
    - family: TTNorms
      fonts:
        - asset: assets/fonts/TTNorms-Medium.otf


